# intents.toml — single source of truth for every keybinding.
#
# ONE row per intent (muscle memory), keyed by the intent NAME below, then
# rendered into each WM's syntax by bin/hexciri-keybinds. Spawn binds are
# 100% portable (they execute a command); layout binds map per-WM.
#
# Combo notation uses "Mod" for Super and XDG-era names (Print, Return,
# grave, BracketLeft, XF86…) so the source reads identically everywhere;
# each renderer translates its own key names.

# `keys` = combo -> intent name (the only ties; a combo appears once).
[keys]
"Mod+Space"      = "launcher"
"Mod+Alt+Space"  = "root-menu"
"Mod+K"          = "keybind-list"
"Mod+Return"     = "terminal"
"Mod+grave"      = "agent"
"Mod+Shift+B"    = "browser"
"Mod+Shift+E"    = "editor"
"Mod+Shift+F"    = "file-manager"
"Mod+Ctrl+M"     = "webapp-messenger"
"XF86Launch5"    = "webapp-gemini"
"XF86Launch6"    = "webapp-photopea"
"Mod+Q"          = "close-window"
"Mod+Left"       = "focus-left"
"Mod+Right"      = "focus-right"
"Mod+Down"       = "focus-down"
"Mod+Up"         = "focus-up"
"Mod+Ctrl+Left"  = "move-left"
"Mod+Ctrl+Right" = "move-right"
"Mod+Ctrl+Down"  = "move-down"
"Mod+Ctrl+Up"    = "move-up"
"Mod+H"          = "focus-left"
"Mod+L"          = "focus-right"
"Mod+J"          = "focus-down"
"Mod+Ctrl+H"     = "move-left"
"Mod+Ctrl+J"     = "move-down"
"Mod+Ctrl+K"     = "move-up"
"Mod+1"          = "ws-1"
"Mod+2"          = "ws-2"
"Mod+3"          = "ws-3"
"Mod+4"          = "ws-4"
"Mod+5"          = "ws-5"
"Mod+6"          = "ws-6"
"Mod+7"          = "ws-7"
"Mod+8"          = "ws-8"
"Mod+9"          = "ws-9"
"Mod+0"          = "ws-browser"
"Mod+Shift+1"    = "move-to-ws-1"
"Mod+Shift+2"    = "move-to-ws-2"
"Mod+Shift+3"    = "move-to-ws-3"
"Mod+Shift+4"    = "move-to-ws-4"
"Mod+Shift+5"    = "move-to-ws-5"
"Mod+Shift+6"    = "move-to-ws-6"
"Mod+Shift+7"    = "move-to-ws-7"
"Mod+Shift+8"    = "move-to-ws-8"
"Mod+Shift+9"    = "move-to-ws-9"
"Mod+Shift+0"    = "move-to-ws-browser"
"Mod+U"          = "ws-prev"
"Mod+I"          = "ws-next"
"Mod+F"          = "maximize-column"
"Mod+Ctrl+F"     = "fullscreen"
"Mod+R"          = "switch-column-width"
"Mod+Shift+R"    = "tabbed-column"
"Mod+Shift+Space" = "toggle-float"
"Mod+P"           = "focus-float"
"Mod+Shift+P"     = "focus-tiling"
"Mod+BracketLeft" = "consume-into-column"
"Mod+BracketRight" = "expel-from-column"
"Mod+Print"        = "screenshot"
"Ctrl+Print"       = "screenshot-clipboard"
"Alt+Print"        = "screenrecord"
"Mod+O"            = "overview"
"Mod+C"            = "copy"
"Mod+V"            = "paste"
"Mod+X"            = "cut"
"Mod+Ctrl+L"       = "lock"
"Mod+Ctrl+V"       = "clipboard-history"
"Mod+Escape"       = "power-menu"
"Mod+Comma"        = "clear-notifications"
"Mod+N"            = "toggle-notifications"
"XF86AudioRaiseVolume" = "vol-up"
"XF86AudioLowerVolume" = "vol-down"
"XF86AudioMute"        = "mute"
"XF86AudioMicMute"     = "mic-mute"
"XF86AudioPlay"        = "play-pause"
"XF86AudioPrev"        = "prev-track"
"XF86AudioNext"        = "next-track"
"XF86MonBrightnessUp"  = "brightness-up"
"XF86MonBrightnessDown" = "brightness-down"

[intents]
launcher = { type = "spawn", command = "hexciri-fuzzel", desc = "App launcher" }
root-menu = { type = "spawn", command = "hexciri-menu", desc = "Root menu" }
keybind-list = { type = "spawn", command = "hexciri-keybinds", desc = "Keybind reference (this list)" }
terminal = { type = "spawn", command = "hexciri-terminal", desc = "Terminal" }
agent = { type = "spawn", command = "hexciri-agent", desc = "AI agent" }
browser = { type = "spawn", command = "xdg-open https://", desc = "Browser" }
editor = { type = "spawn", command = "zeditor", desc = "Text editor" }
file-manager = { type = "spawn", command = "~/.local/bin/strata", desc = "File manager" }
webapp-messenger = { type = "spawn", command = "hexciri-launch-or-focus-webapp messenger https://www.messenger.com", desc = "Messenger webapp" }
webapp-gemini = { type = "spawn", command = "hexciri-launch-or-focus-webapp gemini https://gemini.google.com/app", desc = "Gemini webapp" }
webapp-photopea = { type = "spawn", command = "hexciri-launch-or-focus-webapp photopea https://photopea.com", desc = "Photopea webapp" }

close-window = { type = "action", niri = "close-window", hyprland = "closeactive", sway = "kill", mango = "killclient", desc = "Close window" }

focus-left   = { type = "action", niri = "focus-column-left", hyprland = "movefocus l", sway = "focus left", mango = "focusdir left", desc = "Focus left" }
focus-right  = { type = "action", niri = "focus-column-right", hyprland = "movefocus r", sway = "focus right", mango = "focusdir right", desc = "Focus right" }
focus-down   = { type = "action", niri = "focus-window-down", hyprland = "movefocus d", sway = "focus down", mango = "focusdir down", desc = "Focus down" }
focus-up     = { type = "action", niri = "focus-window-up", hyprland = "movefocus u", sway = "focus up", mango = "focusdir up", desc = "Focus up" }

move-left  = { type = "action", niri = "move-column-left", hyprland = "movewindow l", sway = "move left", mango = "exchange_client left", desc = "Move window left" }
move-right = { type = "action", niri = "move-column-right", hyprland = "movewindow r", sway = "move right", mango = "exchange_client right", desc = "Move window right" }
move-down  = { type = "action", niri = "move-window-down", hyprland = "movewindow d", sway = "move down", mango = "exchange_client down", desc = "Move window down" }
move-up    = { type = "action", niri = "move-window-up", hyprland = "movewindow u", sway = "move up", mango = "exchange_client up", desc = "Move window up" }

ws-1 = { type = "action", niri = "focus-workspace 1", hyprland = "workspace 1", sway = "workspace 1", mango = "view 1", desc = "Workspace 1" }
ws-2 = { type = "action", niri = "focus-workspace 2", hyprland = "workspace 2", sway = "workspace 2", mango = "view 2", desc = "Workspace 2" }
ws-3 = { type = "action", niri = "focus-workspace 3", hyprland = "workspace 3", sway = "workspace 3", mango = "view 3", desc = "Workspace 3" }
ws-4 = { type = "action", niri = "focus-workspace 4", hyprland = "workspace 4", sway = "workspace 4", mango = "view 4", desc = "Workspace 4" }
ws-5 = { type = "action", niri = "focus-workspace 5", hyprland = "workspace 5", sway = "workspace 5", mango = "view 5", desc = "Workspace 5" }
ws-6 = { type = "action", niri = "focus-workspace 6", hyprland = "workspace 6", sway = "workspace 6", mango = "view 6", desc = "Workspace 6" }
ws-7 = { type = "action", niri = "focus-workspace 7", hyprland = "workspace 7", sway = "workspace 7", mango = "view 7", desc = "Workspace 7" }
ws-8 = { type = "action", niri = "focus-workspace 8", hyprland = "workspace 8", sway = "workspace 8", mango = "view 8", desc = "Workspace 8" }
ws-9 = { type = "action", niri = "focus-workspace 9", hyprland = "workspace 9", sway = "workspace 9", mango = "view 9", desc = "Workspace 9" }
ws-browser = { type = "action", niri = "focus-workspace \"browser\"", hyprland = "workspace name:browser", sway = "workspace browser", mango = "view 10", desc = "Browser workspace" }

move-to-ws-1 = { type = "action", niri = "move-column-to-workspace 1", hyprland = "movetoworkspace 1", sway = "move container to workspace 1", mango = "tag 1", desc = "Move window to workspace 1" }
move-to-ws-2 = { type = "action", niri = "move-column-to-workspace 2", hyprland = "movetoworkspace 2", sway = "move container to workspace 2", mango = "tag 2", desc = "Move window to workspace 2" }
move-to-ws-3 = { type = "action", niri = "move-column-to-workspace 3", hyprland = "movetoworkspace 3", sway = "move container to workspace 3", mango = "tag 3", desc = "Move window to workspace 3" }
move-to-ws-4 = { type = "action", niri = "move-column-to-workspace 4", hyprland = "movetoworkspace 4", sway = "move container to workspace 4", mango = "tag 4", desc = "Move window to workspace 4" }
move-to-ws-5 = { type = "action", niri = "move-column-to-workspace 5", hyprland = "movetoworkspace 5", sway = "move container to workspace 5", mango = "tag 5", desc = "Move window to workspace 5" }
move-to-ws-6 = { type = "action", niri = "move-column-to-workspace 6", hyprland = "movetoworkspace 6", sway = "move container to workspace 6", mango = "tag 6", desc = "Move window to workspace 6" }
move-to-ws-7 = { type = "action", niri = "move-column-to-workspace 7", hyprland = "movetoworkspace 7", sway = "move container to workspace 7", mango = "tag 7", desc = "Move window to workspace 7" }
move-to-ws-8 = { type = "action", niri = "move-column-to-workspace 8", hyprland = "movetoworkspace 8", sway = "move container to workspace 8", mango = "tag 8", desc = "Move window to workspace 8" }
move-to-ws-9 = { type = "action", niri = "move-column-to-workspace 9", hyprland = "movetoworkspace 9", sway = "move container to workspace 9", mango = "tag 9", desc = "Move window to workspace 9" }
move-to-ws-browser = { type = "action", niri = "move-column-to-workspace \"browser\"", hyprland = "movetoworkspacesilent name:browser", sway = "move container to workspace browser", mango = "tag 10", desc = "Move window to browser workspace" }

ws-prev = { type = "action", niri = "focus-workspace-down", hyprland = "workspace e+1", sway = "workspace prev", mango = "viewtoleft", desc = "Previous workspace" }
ws-next = { type = "action", niri = "focus-workspace-up", hyprland = "workspace e-1", sway = "workspace next", mango = "viewtoright", desc = "Next workspace" }

maximize-column = { type = "action", niri = "maximize-column", hyprland = "togglefloating maximize", sway = "fullscreen toggle", mango = "togglemaximizescreen", desc = "Maximize column" }
fullscreen   = { type = "action", niri = "fullscreen-window", hyprland = "fullscreen", sway = "fullscreen toggle", mango = "togglefullscreen", desc = "Fullscreen" }
switch-column-width = { type = "action", niri = "switch-preset-column-width", hyprland = "resizeactive", sway = "(See NOTE)", mango = "switch_proportion_preset", desc = "Cycle column width" }
tabbed-column = { type = "action", niri = "toggle-column-tabbed-display", hyprland = "togglegroup", sway = "(See NOTE)", mango = "toggleview", desc = "Tabbed column" }
toggle-float = { type = "action", niri = "toggle-window-floating", hyprland = "togglefloating", sway = "floating toggle", mango = "togglefloating", desc = "Toggle floating" }
focus-float = { type = "action", niri = "focus-floating", hyprland = "focusmode floating", sway = "focus floating", mango = "togglejump", desc = "Focus floating window" }
focus-tiling = { type = "action", niri = "focus-tiling", hyprland = "focusmode tiling", sway = "focus tiling", mango = "togglejump", desc = "Focus tiling window" }
consume-into-column = { type = "action", niri = "consume-window-into-column", hyprland = "swapwindow l", sway = "(See NOTE)", mango = "groupjoin left", desc = "Consume window into column" }
expel-from-column = { type = "action", niri = "expel-window-from-column", hyprland = "swapwindow r", sway = "(See NOTE)", mango = "groupleave", desc = "Expel window from column" }

screenshot = { type = "action", niri = "screenshot", hyprland = "(grim via hexciri-compositor)", sway = "(grim via hexciri-compositor)", mango = "(grim via hexciri-compositor)", desc = "Screenshot" }
screenshot-clipboard = { type = "spawn", command = "sh -c 'grim -g \"$(slurp)\" - | wl-copy'", desc = "Screenshot region to clipboard" }
screenrecord = { type = "spawn", command = "hexciri-screenrecord", desc = "Screen record" }
overview = { type = "action", niri = "toggle-overview", hyprland = "overview:toggle", sway = "(See NOTE)", mango = "toggleoverview", desc = "Overview" }

copy = { type = "spawn", command = "sh -c 'wtype -M ctrl -k c'", desc = "Copy" }
paste = { type = "spawn", command = "sh -c 'wtype -M ctrl -k v'", desc = "Paste" }
cut = { type = "spawn", command = "sh -c 'wtype -M ctrl -k x'", desc = "Cut" }

lock = { type = "spawn", command = "hexciri-lock", desc = "Lock screen" }
clipboard-history = { type = "spawn", command = "hexciri-clipboard", desc = "Clipboard history" }
power-menu = { type = "spawn", command = "hexciri-power", desc = "Power menu" }
clear-notifications = { type = "spawn", command = "noctalia msg notification-clear-active", desc = "Clear notifications" }
toggle-notifications = { type = "spawn", command = "noctalia msg panel-toggle notifications", desc = "Toggle notifications" }

vol-up = { type = "spawn", command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+", desc = "Volume up" }
vol-down = { type = "spawn", command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", desc = "Volume down" }
mute = { type = "spawn", command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", desc = "Mute" }
mic-mute = { type = "spawn", command = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", desc = "Mic mute" }
play-pause = { type = "spawn", command = "playerctl play-pause", desc = "Play / pause" }
prev-track = { type = "spawn", command = "playerctl previous", desc = "Previous track" }
next-track = { type = "spawn", command = "playerctl next", desc = "Next track" }
brightness-up = { type = "spawn", command = "brightnessctl set 5%+", desc = "Brightness up" }
brightness-down = { type = "spawn", command = "brightnessctl set 5%-", desc = "Brightness down" }