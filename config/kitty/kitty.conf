# hexciri default kitty config — theme colors come from the active theme.
# Managed include below; put personal overrides after it.
include ~/.local/state/hexciri/current/theme/kitty.conf

font_family JetBrainsMono Nerd Font
font_size 11.0

window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.35
cursor_shape block
cursor_blink_interval 0

allow_remote_control yes
