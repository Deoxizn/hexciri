# Extra themes — handpicked themes that aren't shipped (any repo naming).
# One theme per line: <owner>/<repo> (literal path after github.com/).
# Short convention names fall back to omarchy-<name>-theme. "Sync extra themes"
# clones every line, and REMOVES local extras whose line you deleted — the list
# is the source of truth. See config/theme-sources/README.md for how to add a creator.
label = Extra themes
owner = mixed
type = per-theme-repos
default = 0