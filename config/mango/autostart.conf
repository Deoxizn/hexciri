# hexciri — autostart rendered for mango
# source: config/niri/autostart.kdl (niri fragment; regenerate with: hexciri-config-render autostart mango)
# exec-once runs once at startup (exec= would re-run on every reload)
exec-once=hexciri-theme-ensure
exec-once=sh -c 'hexciri-strata-install --check >/dev/null 2>&1'
exec-once=noctalia
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=sh -c 'wl-paste --type text --watch cliphist store'
exec-once=sh -c 'wl-paste --type image --watch cliphist store'
exec-once=sh -c 'systemctl --user import-environment $(env | cut -d= -f1) && dbus-update-activation-environment --systemd --all'

