# Keybinds — hexciri core + mango's native defaults, hand-written.
# Policy: every WM keeps its OWN shipped defaults for anything that isn't one of
# the hexciri CORE combos — core combos win, everything else stays as mango
# ships it. Native binds that duplicated a core action EXACTLY were dropped
# (Alt+q killclient, Alt+a togglemaximizescreen, Alt+f togglefullscreen,
# Alt+backslash togglefloating, Alt+x switch_proportion_preset all mirror core
# combos); anything else is mango's default. Core-native collisions: SUPER+n
# switch_layout (core = notifications), SUPER+Left/Right view (core = focus
# arrows), SUPER+r reload_config (core = proportion cycle), SUPER+i minimized,
# SUPER+o toggleoverlay (core = overview).
# Syntax: bind=[flags]MODS,KEY,COMMAND,PARAMS (mango bindings; keymode common).
# Sourced by config.conf (tag_num = 10 → tag 10 is the browser workspace).
#
# Layout control (mango's versatility) at the bottom: SUPER+t tiles, SUPER+s
# switches back to the scroller (mango's layout symbols are "T" and "S"),
# Mod+Shift+Tab cycles per-tag layouts, Mod+Alt+Up/Down resize the master
# area; Mod+r (core) cycles the scroller proportion, native Alt+e sets it.

# ── hexciri core ──
bind=SUPER,0,view,10
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,c,spawn_shell,sh -c 'wtype -M ctrl -k c'
bind=SUPER,f,togglemaximizescreen
bind=SUPER,h,focusdir,left
bind=SUPER,i,viewtoright
bind=SUPER,j,focusdir,down
bind=SUPER,k,spawn,hexciri-keybinds
bind=SUPER,l,focusdir,right
bind=SUPER,n,spawn,noctalia msg panel-toggle notifications
bind=SUPER,o,toggleoverview
# Mod+P → (See NOTE — mango has no float/tiling focus modes)
bind=SUPER,q,killclient
bind=SUPER,r,switch_proportion_preset
bind=SUPER,u,viewtoleft
bind=SUPER,v,spawn_shell,sh -c 'wtype -M ctrl -k v'
bind=SUPER,x,spawn_shell,sh -c 'wtype -M ctrl -k x'
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down
bind=SUPER,left,focusdir,left
bind=ALT,print,spawn,hexciri-screenrecord
