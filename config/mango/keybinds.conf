# Keybinds — rendered from config/keybinds/intents.toml (experimental)
# bind=[flags]MODS,KEY,COMMAND,PARAMS — dwl heritage: view X = show tag X,
# tag X = send client to tag X (see mango skill; key names from wev).
# Sourced by config.conf. Regenerate with:
#   hexciri-keybinds-render mango > config/mango/keybinds.conf
bind=SUPER,0,view,10
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,C,spawn_shell,sh -c 'wtype -M ctrl -k c'
bind=SUPER,D,spawn,noctalia msg panel-toggle launcher
# Mod+F → (See NOTE)
# Mod+H → (See NOTE — dwl stacks, no directional focus)
bind=SUPER,I,viewtoright
# Mod+J → (See NOTE — dwl stacks, no directional focus)
bind=SUPER,K,spawn,hexciri-keybinds
# Mod+L → (See NOTE — dwl stacks, no directional focus)
bind=SUPER,N,spawn,noctalia msg panel-toggle notifications
# Mod+O → (See NOTE)
# Mod+P → (See NOTE)
bind=SUPER,Q,killclient
# Mod+R → (See NOTE)
bind=SUPER,U,viewtoleft
bind=SUPER,V,spawn_shell,sh -c 'wtype -M ctrl -k v'
bind=SUPER,X,spawn_shell,sh -c 'wtype -M ctrl -k x'
# Mod+Up → (See NOTE — dwl stacks, no directional focus)
# Mod+Down → (See NOTE — dwl stacks, no directional focus)
# Mod+Left → (See NOTE — dwl stacks, no directional focus)
bind=ALT,Print,spawn,hexciri-screenrecord
bind=SUPER,Comma,spawn,noctalia msg notification-clear-active
bind=SUPER,Print,spawn_shell,hexciri-compositor screenshot
# Mod+Right → (See NOTE — dwl stacks, no directional focus)
bind=SUPER,Space,spawn,hexciri-fuzzel
bind=SUPER,grave,spawn,hexciri-agent
bind=CTRL,Print,spawn_shell,sh -c 'grim -g "$(slurp)" - | wl-copy'
# Mod+Ctrl+F → (See NOTE — fakefullscreen via windowrule)
# Mod+Ctrl+H → (See NOTE — no directional move)
# Mod+Ctrl+J → (See NOTE — no directional move)
# Mod+Ctrl+K → (See NOTE — no directional move)
bind=SUPER+CTRL,L,spawn,hexciri-lock
bind=SUPER+CTRL,M,spawn,hexciri-launch-or-focus-webapp messenger https://www.messenger.com
bind=SUPER+CTRL,V,spawn,hexciri-clipboard
bind=SUPER,Escape,spawn,hexciri-power
bind=SUPER,Return,spawn,hexciri-terminal
# Mod+Ctrl+Up → (See NOTE — no directional move)
bind=SUPER+SHIFT,0,tag,10
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,B,spawn,xdg-open https://
bind=SUPER+SHIFT,E,spawn,zeditor
bind=SUPER+SHIFT,F,spawn,~/.local/bin/strata
# Mod+Shift+P → (See NOTE)
# Mod+Shift+R → (See NOTE)
bind=NONE,XF86Launch5,spawn,hexciri-launch-or-focus-webapp gemini https://gemini.google.com/app
bind=NONE,XF86Launch6,spawn,hexciri-launch-or-focus-webapp photopea https://photopea.com
bind=SUPER+ALT,Space,spawn,hexciri-menu
# Mod+Ctrl+Down → (See NOTE — no directional move)
# Mod+Ctrl+Left → (See NOTE — no directional move)
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
# Mod+Ctrl+Right → (See NOTE — no directional move)
# Mod+BracketLeft → (See NOTE)
# Mod+Shift+Space → (See NOTE — float via windowrule open_as_floating)
# Mod+BracketRight → (See NOTE)
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
