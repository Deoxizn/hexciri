# Hexciri — Mango config (entry point)
# https://github.com/deoxizn/hexciri
#
# This file is the entry point only: it sources the per-concern fragments via
# source-optional= (mango "Sub-Configuration"; docs say env/input/etc reset on
# every config reload, so sourced files re-assert them — see the mango skill).
#
#   env.conf          -- env=... — wayland hints for every app
#   input.conf        -- xkb_*, tap_to_click, trackpad_* — input globals
#   monitors.conf     -- monitorrule=... — screens, scale, mode, VRR
#   looknfeel.conf    -- THEME-OWNED borders/gaps (focuscolor/unfocuscolor)
#   window-rules.conf -- windowrule=... — floating dialogs (samples)
#   keybinds.conf     -- bind=... — hexciri core (hand-written)
#   autostart.conf    -- exec-once=... — boot-time services & shell
#
# Split so each concern is easy to find, edit and back up on its own.
# To add custom keybinds without touching the schema, append bind= lines here
# after the sources (or in your own =local.conf sourced at the end).

source-optional=~/.config/mango/env.conf
source-optional=~/.config/mango/input.conf
source-optional=~/.config/mango/monitors.conf
source-optional=~/.config/mango/looknfeel.conf
source-optional=~/.config/mango/window-rules.conf
source-optional=~/.config/mango/keybinds.conf
source-optional=~/.config/mango/autostart.conf

# 10 tags — the intent schema binds workspace 1-9 and reserves tag 10 for the
# browser workspace (Mod+0 / Mod+Shift+0). mango's default is 9, which would
# silently no-op the browser tag.
tag_num = 10