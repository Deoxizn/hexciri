# Hexciri — Mango fragment: Look & feel — THEME-OWNED.
# Sourced by config.conf. The hexciri theme hook (hexciri-sync.sh) REWRITES the
# two color keys below on every theme change, so keep this file to theme surface
# only (borders, gaps) — window rules/layout live in their own fragments.
# Colors are 0xRRGGBBAA (mango); placeholders below — the theme hook replaces
# them at theme-set time.

borderpx=2
border_radius=10
focuscolor=0xff7c3aed
bordercolor=0x991a1a2e
urgentcolor=0xfff7768e
rootcolor=0xff16161e
gappih=2
gappiv=2
gappoh=0
gappov=0