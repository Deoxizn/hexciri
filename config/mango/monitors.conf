# Hexciri — Mango fragment: Monitors / outputs (monitorrule=)
# Sourced by config.conf. On a WM swap this is the ONLY fragment replaced
# whole-hog by the carry-over (your installed monitor layout overwrites
# hexciri's copy), so keep it to pure monitorrule= lines and comments.
# Match by name (regex), make, model, serial. Params: width/height/refresh,
# x/y/scale/vrr/hdr/rr, disable. Without a matching rule mango falls back to
# the connector's preferred mode — the default below pins the laptop panel.
#
# Default for this machine's laptop panel (eDP-1, 2880x1920@120, 2x HiDPI).
# On a desktop, or if your panel has a different name, run:  mmsg get outputs
# then edit the regex and set your values.
#
#   monitorrule=name:eDP-1,width:2880,height:1920,refresh:120,scale:2,x:0,y:0,vrr:1
#
# Desktop / second monitor example (commented — enable by editing):
#   monitorrule=name:DP-1,x:1920,y:0,scale:1,vrr:1
# ──────────────────────────────────────────────

monitorrule=name:eDP-1,width:2880,height:1920,refresh:120,scale:2,x:0,y:0