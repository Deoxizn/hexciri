# Hexciri — Mango fragment: Window rules (floating dialogs)
# Sourced by config.conf. Mirrors the niri window-rules.kdl samples — the
# floating-popup list. Static hexciri defaults, not theme-generated.
# Format: windowrule=appid:<regex>[,title:...],param:value,...

windowrule=appid:pavucontrol,isfloating
windowrule=appid:nm-connection-editor,isfloating
windowrule=appid:blueman-manager,isfloating
windowrule=appid:org.gnome.Calculator,isfloating
windowrule=appid:org.gnome.Settings,isfloating
windowrule=appid:feh,isfloating
windowrule=appid:imv,isfloating
windowrule=appid:localsend,isfloating,width:1100,height:700