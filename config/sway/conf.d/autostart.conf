# hexciri — autostart rendered for sway
# source: config/niri/autostart.kdl (niri fragment; regenerate with: hexciri-config-render autostart sway)

exec hexciri-theme-ensure
exec hexciri-strata-install --check >/dev/null 2>&1
exec noctalia
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec systemctl --user import-environment $(env | cut -d= -f1) && dbus-update-activation-environment --systemd --all

