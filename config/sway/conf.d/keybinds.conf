# Keybinds — hexciri core + sway's native defaults, hand-written.
# Policy: every WM keeps its OWN shipped defaults for anything that isn't one of
# the hexciri CORE combos — core combos win. Core re-homes vs config.in: launcher
# on Mod+Space (native $mod+space was "focus mode_toggle"), close on Mod+Q
# (native kill was $mod+Shift+q, kept below), and these natives were dropped
# because they collide with core: $mod+Shift+e exit (Mod+Shift+E is the editor),
# $mod+v splitv (Mod+V is paste), $mod+r resize mode (Mod+R core NOTE below),
# $mod+f fullscreen (core), $mod+1-0 / Shift+1-0 / arrows / Return / space /
# Shift+space / media keys (core owns them).
# Included via `include ~/.config/sway/conf.d/*`. Rendered-from-intents header
# retired; this is the static definition.
bindsym Mod4+0 workspace browser
bindsym Mod4+1 workspace 1
bindsym Mod4+2 workspace 2
bindsym Mod4+3 workspace 3
bindsym Mod4+4 workspace 4
bindsym Mod4+5 workspace 5
bindsym Mod4+6 workspace 6
bindsym Mod4+7 workspace 7
bindsym Mod4+8 workspace 8
bindsym Mod4+9 workspace 9
bindsym Mod4+C exec sh -c 'wtype -M ctrl -k c'
bindsym Mod4+F fullscreen toggle
bindsym Mod4+H focus left
bindsym Mod4+I workspace next
bindsym Mod4+J focus down
bindsym Mod4+K exec hexciri-keybinds
bindsym Mod4+L focus right
bindsym Mod4+N exec noctalia msg panel-toggle notifications
# Mod+O → sway has no overview (see swaymod overview crate / See NOTE)
bindsym Mod4+P focus floating
bindsym Mod4+Q kill
# Mod+R → (See NOTE)
bindsym Mod4+U workspace prev
bindsym Mod4+V exec sh -c 'wtype -M ctrl -k v'
bindsym Mod4+X exec sh -c 'wtype -M ctrl -k x'
bindsym Mod4+Up focus up
bindsym Mod4+Down focus down
bindsym Mod4+Left focus left
bindsym Mod1+Print exec hexciri-screenrecord
bindsym Mod4+comma exec noctalia msg notification-clear-active
bindsym Mod4+Print exec hexciri-compositor screenshot
bindsym Mod4+Right focus right
bindsym Mod4+space exec hexciri-fuzzel
bindsym Mod4+grave exec hexciri-agent
bindsym Ctrl+Print exec sh -c 'grim -g "$(slurp)" - | wl-copy'
bindsym Mod4+Ctrl+F fullscreen toggle
bindsym Mod4+Ctrl+H move left
bindsym Mod4+Ctrl+J move down
bindsym Mod4+Ctrl+K move up
bindsym Mod4+Ctrl+L exec hexciri-lock
bindsym Mod4+Ctrl+M exec hexciri-launch-or-focus-webapp messenger https://www.messenger.com
bindsym Mod4+Ctrl+V exec hexciri-clipboard
bindsym Mod4+Escape exec hexciri-power
bindsym Mod4+Return exec hexciri-terminal
bindsym Mod4+Ctrl+Up move up
bindsym Mod4+Shift+0 move container to workspace browser
bindsym Mod4+Shift+1 move container to workspace 1
bindsym Mod4+Shift+2 move container to workspace 2
bindsym Mod4+Shift+3 move container to workspace 3
bindsym Mod4+Shift+4 move container to workspace 4
bindsym Mod4+Shift+5 move container to workspace 5
bindsym Mod4+Shift+6 move container to workspace 6
bindsym Mod4+Shift+7 move container to workspace 7
bindsym Mod4+Shift+8 move container to workspace 8
bindsym Mod4+Shift+9 move container to workspace 9
bindsym Mod4+Shift+B exec xdg-open https://
bindsym Mod4+Shift+E exec zeditor
bindsym Mod4+Shift+F exec ~/.local/bin/strata
bindsym Mod4+Shift+P focus tiling
# Mod+Shift+R → (See NOTE)
bindsym Mod4+Mod1+space exec hexciri-menu
bindsym Mod4+Ctrl+Down move down
bindsym Mod4+Ctrl+Left move left
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPrev exec playerctl previous
bindsym Mod4+Ctrl+Right move right
# Mod+BracketLeft → (See NOTE)
bindsym Mod4+Shift+space floating toggle
# Mod+BracketRight → (See NOTE)
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# ── sway's native defaults (kept: not core combos) ──
bindsym $mod+Shift+q kill
bindsym $mod+d exec wmenu-run
bindsym $mod+Shift+c reload
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
bindsym $mod+b splith
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+a focus parent
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show
bindsym Print exec grim
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioStop exec playerctl stop
# native dragging: hold Mod and drag with the mouse
floating_modifier $mod normal