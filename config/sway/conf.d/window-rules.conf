# Hexciri — Sway fragment: Window rules (floating dialogs)
# Included by the conf.d/* glob in sway/config. Mirrors the niri window-rules.kdl
# samples — the floating-popup list. Static hexciri defaults, not theme-generated.
# Workspace targeting: use `workspace number <n>` / `workspace <name>` with
# `assign` — see the sway skill for assign/for_window semantics.

for_window [app_id="pavucontrol"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="blueman-manager"] floating enable
for_window [app_id="org.gnome.Calculator"] floating enable
for_window [app_id="org.gnome.Settings"] floating enable
for_window [app_id="feh"] floating enable
for_window [app_id="imv"] floating enable
for_window [app_id="localsend" title="Share"] floating enable, resize set 1100 700