# Hexciri — Sway fragment: Monitors / outputs
# Included by the conf.d/* glob in sway/config. On a WM swap this is the ONLY
# fragment replaced whole-hog by the carry-over (your installed monitor layout
# overwrites hexciri's copy), so keep it to pure output { } blocks and comments.
#
# Default for this machine's laptop panel (eDP-1, 2880x1920@120, 2x HiDPI). On
# a desktop, or if your panel has a different name, run:  swaymsg -t get_outputs
# then set your name/value. Settings you can set:
#   mode 2880x1920@120       -- WIDTHxHEIGHT@REFRESH — resolution + refresh
#   scale 2                  -- UI scaling; 1 for native, 1.25/1.5/2 fractional
#   position 0,0             -- arrange multi-monitor layout (negative allowed)
#   bg / wallpaper           -- sway draws nothing behind windows by default
# The niri counterpart (config/niri/monitors.kdl) documents the options in its
# "Per-output settings you can set:" block — same semantics here.

output "eDP-1" {
    scale 2
    # mode 2880x1920@120
    # position 0,0
    # bg #1a1a2e solid_color        # no default wallpaper — Noctalia sets one
}

# Desktop / second monitor example (commented — enable by editing):
# output "DP-1" {
#     scale 1
#     # mode 2560x1440@144
#     # adaptive_sync on      # VRR/FreeSync (sway ≥ 1.7)
# }
# Save → sway live-reloads (or: swaymsg reload). Scale is fractional. VRR is
# `adaptive_sync on` per output; the carry-over keeps mode+scale+position.
# ──────────────────────────────────────────────