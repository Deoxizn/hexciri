# Hexciri — Sway fragment: Look & feel — THEME-OWNED.
# Included by the conf.d/* glob in sway/config. The hexciri theme hook
# (hexciri-sync.sh) REWRITES the two client.* lines on every theme change, so
# keep this file to that surface only (borders, gaps) — layout/window rules
# live in their own fragments.
# Format: client.focused|unfocused <border-active> <border-inactive> <bg> <title-text>
# Placeholder colors below — the theme hook replaces them at theme-set time.

client.focused   #7c3aed #7c3aed #1a1a2e #c0d0e0
client.unfocused #1a1a2e #1a1a2e #1a1a2e #586070
default_border pixel 2
default_floating_border pixel 2
gaps inner 2
gaps outer 0