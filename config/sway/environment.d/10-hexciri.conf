# hexciri — environment for sway (rendered from the niri env fragment).
# Imported by the sway session command so every spawned app sees the
# Wayland stack. Regenerate with: hexciri-config-render env niri
PATH=/home/devi/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto
_JAVA_AWT_WM_NONREPARENTING=1
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_TYPE=wayland
MOZ_ENABLE_WAYLAND=1
CLUTTER_BACKEND=wayland
SDL_VIDEODRIVER=wayland,x11
GDK_BACKEND=wayland,x11
