# Hexciri preset for the noctalia "yuuto/arch-updater" plugin.
# The framework sync merges the missing keys of this table into
# ~/.local/state/noctalia/settings.toml (plugin-level settings are
# state-dir-owned; GUI overrides win, so existing values are left alone).
#
# update_cmd is run inside the plugin's own terminal wrapper
# (`<terminal> -e bash -c ... tee -a log; read -n 1`), so kitty provides the
# PTY and no `script -qec`/guard layer is needed. hexciri-update does
# free-space check, `sudo pacman -Syu`, AUR via any installed helper, and a
# kernel-reboot prompt. (Pre-rename "hexciri-update-run" stays working via a
# shim and is migrated to this name on the next real update.)
#
# terminal carries --app-id=TUI.float so the window matches the floating
# TUI rule on both compositors (Hyprland hexciri-windowrules.lua, Niri
# window-rules.kdl). The plugin builds `<terminal> -e sh -lc ...`, so extra
# flags ride along and its binary detection (first token) still sees kitty.
[plugin_settings."yuuto/arch-updater"]
aur_helper = "auto"
auto_check_hours = 1
flatpak_enabled = false
terminal = "kitty --app-id=TUI.float"
update_cmd = "hexciri-update"
update_mode = "terminal"