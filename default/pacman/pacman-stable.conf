# See the pacman.conf(5) manpage for option and repository directives
# hexciri stable channel — month-held pkgs

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
# gnome-keyring 50.0 crashes on concurrent Secret Service access (upstream,
# unfixed). Pinned at 48.0; delete this line once a fixed 50.x ships.
IgnorePkg = gnome-keyring

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch
