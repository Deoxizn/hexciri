# See the pacman.conf(5) manpage for option and repository directives
# hexciri bleeding channel — normal Arch rolling release (official mirrors);
# cachyos kernels are direct-fetched by hexciri-cachyos, no repo needed

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
# gnome-keyring 50.0 crashes on concurrent Secret Service access (upstream,
# unfixed). Pinned at 48.0; delete this line once a fixed 50.x ships.
IgnorePkg = gnome-keyring

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
